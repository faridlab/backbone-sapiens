# =============================================================================
# Domain: Sapiens
# Entity: IntegrationCredential
# Description: Minimal ADR-0024 credential store — envelope-encrypted secrets for
# outbound integrations (payment gateway codecs, API re-fetch, OAuth tokens).
# Verbs only (issue/read_secret/rotate/revoke/describe); deliberately NOT on the
# CRUD surface. The secret material lives only in `ciphertext`; it never appears
# in any HTTP response (metadata-only) and never in plain config.
# =============================================================================

models:
  - name: IntegrationCredential
    collection: integration_credentials
    description: "Envelope-encrypted credential for an external integration, scoped to one provider account and purpose"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Unique credential identifier"

      # Books owner — strict company fence. A credential belongs to the tenant that
      # configured the integration; the app role must set app.company_id to read it.
      company_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning company # logical FK to organization.Company.id"

      provider:
        type: string
        attributes: ["@required", "@max(60)"]
        description: "External provider slug (e.g. midtrans, xendit, doku)"

      account_ref:
        type: string
        attributes: ["@required", "@max(120)"]
        description: "Provider-side account reference — for payment gateways the payment_gateway.PaymentGatewayProvider.id; scopes the credential to one configured account"

      purpose:
        type: CredentialPurpose
        attributes: ["@required"]
        description: "What the secret authenticates: webhook signature verification, provider API reads, provider API writes, or an OAuth token"

      key_id:
        type: string
        attributes: ["@required", "@max(60)"]
        description: "KEK generation id — HKDF info string; rotating the master key mints a new key_id and a later re-encrypt pass"

      ciphertext:
        type: string
        attributes: ["@required", "@sensitive"]
        description: "base64(nonce ‖ ct ‖ tag) of the secret under AES-256-GCM; AAD binds provider:account_ref:purpose so a copied row will not decrypt elsewhere"

      # One lifecycle enum, no boolean impostors (tree-wide convention):
      # active → expired | revoked. `expired` and `revoked` are terminal; expired is
      # set lazily (read-time CAS) or eagerly by rotate lineage; reads of a
      # non-active credential fail closed. No soft delete — revocation is the end.
      status:
        type: CredentialStatus
        attributes: ["@default(active)"]
        description: "Lifecycle (only an active credential can be read)"

      expires_at:
        type: datetime?
        description: "Honest expiry from the provider; NULL = genuinely non-expiring (e.g. a webhook secret that does not rotate)"

      rotated_from:
        type: uuid?
        attributes: ["@foreign_key(IntegrationCredential.id)"]
        description: "Predecessor credential this one replaced (rotate lineage)"

      last_used_at:
        type: datetime?
        description: "Last successful read_secret (observability for stale secrets)"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      rotated_from_credential:
        type: IntegrationCredential?
        attributes: ["@one", "@foreign_key(rotated_from)"]
        description: "Predecessor credential"
        inverse: successors

      successors:
        type: IntegrationCredential[]
        attributes: ["@one_to_many"]
        description: "Credentials that replaced this one"
        inverse: rotated_from_credential

    indexes:
      - type: unique
        fields: [company_id, provider, account_ref, purpose]
        where: "status = 'active'"
        description: "At most one active credential per scope+purpose"
      - type: index
        fields: [company_id, provider, account_ref]
      - type: index
        fields: [company_id, status]

enums:
  - name: CredentialPurpose
    description: "What an integration credential authenticates"
    variants:
      - name: webhook_verify
        description: "Secret used to verify inbound webhook signatures (HMAC key or provider signing secret)"
      - name: api_read
        description: "Provider API read credential (status re-fetch, invoice lookup)"
      - name: api_write
        description: "Provider API write credential (charge creation, refund)"
      - name: oauth_token
        description: "OAuth client secret or token material for a linked provider"

  - name: CredentialStatus
    description: "Lifecycle of a stored credential"
    variants:
      - name: active
        default: true
        description: "Readable and usable; the only status read_secret serves"
      - name: expired
        description: "Passed its honest expiry (set lazily at read time or by rotation lineage); terminal"
      - name: revoked
        description: "Withdrawn by an operator or replaced by rotation; terminal"
