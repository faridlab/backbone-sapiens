# OrganizationRole Entity - Organization-specific role definitions
# Source: libs/modules/sapiens/docs/spec-sapiens.md
#
# PENDING ADR-0005 DISPOSITION — see organization_user.model.yaml. `Organization` never existed;
# the tenant is the database (ADR-0005). Repurpose or remove; do not build on it.

models:
  - name: OrganizationRole
    collection: organization_roles
    soft_delete: true
    description: "Organization-specific role definitions"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      organization_id:
        type: uuid
        # Was @foreign_key(corpus.Organization.id) — a target that never existed (Organization
        # was "moved to corpus", but corpus was built as a knowledge base). Per ADR-0005 the
        # tenant is the database, not an Organization entity, so this FK is permanently dangling
        # and is now excluded rather than asserted. Disposition of this whole subsystem is a
        # follow-up to ADR-0005; do not build on it.
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Organization ID (pending ADR-0005 disposition; no Organization entity exists)"

      name:
        type: string
        attributes: ["@required", "@max(100)"]
        description: "Role name"

      description:
        type: string?
        attributes: ["@max(500)"]
        description: "Role description"

      permissions:
        type: json?
        description: "Role permissions"

      status:
        type: OrganizationRoleStatus
        attributes: ["@default(active)"]
        description: "Role lifecycle; only active roles can be assigned and grant permissions"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: index
        fields: [organization_id]
      - type: index
        fields: [organization_id, name]
      - type: index
        fields: [status]

enums:
  - name: OrganizationRoleStatus
    description: "Lifecycle of an organization role"
    variants:
      - name: active
        description: "Role can be assigned and grants its permissions"
        default: true
      - name: inactive
        description: "Role is retired; assignments stop resolving"
