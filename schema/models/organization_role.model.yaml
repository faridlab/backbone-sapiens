# OrganizationRole Entity - Org-unit-scoped role definitions
# Source: libs/modules/sapiens/docs/spec-sapiens.md
#
# DISPOSITION RESOLVED by ADR-0027/0028 (was pending ADR-0005): the tenant is the
# DATABASE, and a tenant's RBAC lives whole inside it. This model is a role defined
# for one node of the tenant's org tree.
#
# Scoped per org-unit node (ADR-0028). The key previously carried the never-built
# `Organization` entity's id; it names organization.org_units nodes now, so
# branch-scoped roles are expressible.

models:
  - name: OrganizationRole
    collection: organization_roles
    soft_delete: true
    description: "Organization-specific role definitions"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      org_unit_id:
        type: uuid
        # Was @foreign_key(corpus.Organization.id) — a target that never existed
        # (Organization was "moved to corpus", but corpus was built as a knowledge
        # base). Per ADR-0027/0028 the org tree replaces the Organization entity;
        # the re-keyed column names organization.org_units nodes, kept soft
        # (exclude_from_foreign_key_check) because the org tree lives in another
        # schema.
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning org-unit node (organization.org_units)"

      name:
        type: string
        attributes: ["@required", "@max(100)"]
        description: "Role name"

      description:
        type: string?
        attributes: ["@max(500)"]
        description: "Role description"

      permissions:
        type: json?
        description: "Role permissions"

      status:
        type: OrganizationRoleStatus
        attributes: ["@default(active)"]
        description: "Role lifecycle; only active roles can be assigned and grant permissions"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: index
        fields: [org_unit_id]
      - type: index
        fields: [org_unit_id, name]
      - type: index
        fields: [status]

enums:
  - name: OrganizationRoleStatus
    description: "Lifecycle of an organization role"
    variants:
      - name: active
        description: "Role can be assigned and grants its permissions"
        default: true
      - name: inactive
        description: "Role is retired; assignments stop resolving"
