# OrganizationRole Entity - Organization-specific role definitions
# Source: libs/modules/sapiens/docs/spec-sapiens.md
#
# DISPOSITION RESOLVED by ADR-0027/0028 (was pending ADR-0005): the tenant is the DATABASE, and
# a tenant's RBAC lives whole inside it. This model is a role defined for one node of the
# tenant's org tree — during the re-key transition `organization_id` holds a company id, which
# the UUID-stable spine guarantees is a valid `organization.org_units` node. The column re-keys
# to `org_unit_id` with the all-modules company_id sweep, making branch-scoped roles
# expressible.

models:
  - name: OrganizationRole
    collection: organization_roles
    soft_delete: true
    description: "Organization-specific role definitions"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      organization_id:
        type: uuid
        # Was @foreign_key(corpus.Organization.id) — a target that never existed (Organization
        # was "moved to corpus", but corpus was built as a knowledge base). Per ADR-0027/0028
        # the org tree replaces the Organization entity: during the re-key transition this holds
        # a company id, which the UUID-stable spine guarantees is a valid
        # organization.org_units node. Re-keys to org_unit_id with the all-modules sweep.
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Org unit this role is defined for (re-keys to org_unit_id with the company_id sweep)"

      name:
        type: string
        attributes: ["@required", "@max(100)"]
        description: "Role name"

      description:
        type: string?
        attributes: ["@max(500)"]
        description: "Role description"

      permissions:
        type: json?
        description: "Role permissions"

      status:
        type: OrganizationRoleStatus
        attributes: ["@default(active)"]
        description: "Role lifecycle; only active roles can be assigned and grant permissions"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: index
        fields: [organization_id]
      - type: index
        fields: [organization_id, name]
      - type: index
        fields: [status]

enums:
  - name: OrganizationRoleStatus
    description: "Lifecycle of an organization role"
    variants:
      - name: active
        description: "Role can be assigned and grants its permissions"
        default: true
      - name: inactive
        description: "Role is retired; assignments stop resolving"
