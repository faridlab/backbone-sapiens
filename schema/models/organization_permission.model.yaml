# OrganizationPermission Entity - Org-unit-scoped permission grants
#
# DISPOSITION RESOLVED by ADR-0027/0028 (was pending ADR-0005): the tenant is the
# DATABASE, and a tenant's RBAC lives whole inside it. This model is a permission
# grant anchored to one node of the tenant's org tree.
#
# Scoped per org-unit node (ADR-0028); the key previously carried the never-built
# `Organization` entity's id.
# Source: libs/modules/sapiens/docs/spec-sapiens.md

models:
  - name: OrganizationPermission
    collection: organization_permissions
    soft_delete: true
    description: "Organization-level permission grants"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      org_unit_id:
        type: uuid
        # Was @foreign_key(corpus.Organization.id) — a phantom target (see
        # organization_role). Per ADR-0027/0028 the org tree replaces the
        # Organization entity; the re-keyed column names organization.org_units
        # nodes, kept soft because the org tree lives in another schema.
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning org-unit node (organization.org_units)"

      permission_id:
        type: uuid
        attributes: ["@required", "@foreign_key(Permission.id)"]
        description: "Granted permission"

      permission_name:
        type: string?
        attributes: ["@max(100)"]
        description: "Permission name/identifier"

      resource_id:
        type: uuid?
        attributes: ["@exclude_from_foreign_key_check"]
        description: "Resource ID this permission applies to"

      resource_type:
        type: string?
        attributes: ["@max(100)"]
        description: "Resource type this permission applies to"

      role_id:
        type: uuid?
        attributes: ["@foreign_key(Role.id)"]
        description: "Role ID"

      granted_by:
        type: uuid
        attributes: ["@required", "@foreign_key(User.id)"]
        description: "Who granted this permission"

      granted_at:
        type: datetime
        attributes: ["@required", "@default(now)"]
        description: "Grant timestamp"

      expires_at:
        type: datetime?
        description: "Optional expiration"

      reason:
        type: string?
        attributes: ["@max(1000)"]
        description: "Justification for grant"

      status:
        type: OrganizationPermissionStatus
        attributes: ["@default(active)"]
        description: "Grant lifecycle; only active grants take effect"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      permission:
        type: Permission
        attributes: ["@one", "@foreign_key(permission_id)"]

      role:
        type: Role?
        attributes: ["@one", "@foreign_key(role_id)"]

      granter:
        type: User
        attributes: ["@one", "@foreign_key(granted_by)"]

    indexes:
      - type: index
        fields: [org_unit_id]
      - type: index
        fields: [permission_id]
      - type: index
        fields: [role_id]
      - type: index
        fields: [expires_at]

enums:
  - name: OrganizationPermissionStatus
    description: "Lifecycle of an organization permission grant"
    variants:
      - name: active
        description: "Grant is in force"
        default: true
      - name: inactive
        description: "Grant is withdrawn and no longer authorizes anything"
