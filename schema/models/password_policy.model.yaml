# PasswordPolicy Entity - Enterprise password policy configuration with complex business rules
# Source: libs/modules/sapiens/docs/spec-sapiens.md

models:
  - name: PasswordPolicy
    collection: password_policies
    soft_delete: true
    description: "Enterprise password policy configuration with complex business rules"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      name:
        type: string
        attributes: ["@required", "@max(100)"]
        description: "Policy name for identification"

      org_unit_id:
        type: uuid
        attributes: ["@required", "@org_root_shared", "@exclude_from_foreign_key_check"]
        # The tenant-global default policy anchors on the org-tree ROOT node
        # (@org_root_shared widens the kind guard to admit it); a company or
        # branch node scopes the policy to that unit (organization.org_units,
        # ADR-0028 — shared rows never ride a NULL key).
        description: "Owning org-unit node (root node = tenant-global default policy)"

      status:
        type: PasswordPolicyStatus
        attributes: ["@default(active)"]
        description: "Whether this policy is currently enforced"

      password_requirements:
        type: json
        attributes: ["@required"]
        description: "Complex password requirement configuration"

      password_history:
        type: json
        attributes: ["@required"]
        description: "Password history settings"

      reset_settings:
        type: json
        attributes: ["@required"]
        description: "Password reset settings"

      expiry_settings:
        type: json
        attributes: ["@required"]
        description: "Password expiry settings"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    indexes:
      - type: unique
        fields: [org_unit_id]
      - type: index
        fields: [status]

enums:
  - name: PasswordPolicyStatus
    description: "Lifecycle of a password policy"
    variants:
      - name: active
        default: true
        description: "Policy is enforced"
      - name: inactive
        description: "Policy is not enforced"
