# OrganizationUser Entity - Organization membership for users
#
# DISPOSITION RESOLVED by ADR-0027/0028 (was pending ADR-0005): the tenant is the DATABASE, and
# identity/membership stays whole inside each tenant database. This model is membership WITHIN a
# tenant: it links a user to the org-tree node(s) they may act at. During the org re-key
# transition `organization_id` holds a company id, which the org spine guarantees is a valid
# `organization.org_units` node (the spine copy is UUID-stable — a company's node id IS the
# company id), so login and org-scope resolution may join on it as-is. The column re-keys to
# `org_unit_id` with the all-modules company_id sweep, making branch-level membership expressible.
# Source: libs/modules/sapiens/docs/spec-sapiens.md

models:
  - name: OrganizationUser
    collection: organization_users
    soft_delete: true
    description: "Organization membership for users"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      organization_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Organization ID"

      user_id:
        type: uuid
        attributes: ["@required", "@foreign_key(User.id)"]
        description: "User ID"

      role_id:
        type: uuid?
        attributes: ["@foreign_key(Role.id)"]
        description: "Role ID in organization"

      status:
        type: OrganizationMembershipStatus
        attributes: ["@default(active)"]
        description: "Membership status"

      joined_at:
        type: datetime
        attributes: ["@required", "@default(now)"]
        description: "When user joined organization"

      left_at:
        type: datetime?
        description: "When user left organization"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      user:
        type: User
        attributes: ["@one", "@foreign_key(user_id)", "@on_delete(cascade)"]

      role:
        type: Role?
        attributes: ["@one", "@foreign_key(role_id)", "@on_delete(set_null)"]

    indexes:
      - type: index
        fields: [organization_id]
      - type: index
        fields: [user_id]
      - type: index
        fields: [organization_id, user_id]
      - type: index
        fields: [status]

enums:
  - name: OrganizationMembershipStatus
    variants:
      - name: active
        default: true
        description: "Active membership"
      - name: inactive
        description: "Inactive membership"
      - name: pending
        description: "Pending membership"
      - name: suspended
        description: "Suspended membership"
