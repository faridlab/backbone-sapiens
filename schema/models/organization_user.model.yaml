# OrganizationUser Entity - Org-unit membership for users
#
# DISPOSITION RESOLVED by ADR-0027/0028 (was pending ADR-0005): the tenant is the
# DATABASE, and identity/membership stays whole inside each tenant database. This
# model is membership WITHIN a tenant: it links a user to the org-tree node(s)
# they may act at.
#
# The membership key is `org_unit_id` and references organization.org_units nodes
# (ADR-0028: one org tree is the scoping key). The values carried before the re-key
# were the legacy company ids verbatim — the spine mirrored companies.id as
# company-kind nodes, UUID-stable — so the re-key renamed the column without
# touching data, and branch-level membership is expressible now. First row of a
# user's active memberships is the acting unit; the rest are read entitlements
# (see the host's token mint).
# Source: libs/modules/sapiens/docs/spec-sapiens.md

models:
  - name: OrganizationUser
    collection: organization_users
    soft_delete: true
    description: "Organization membership for users"

    fields:
      id:
        type: uuid
        attributes: ["@id", "@default(uuid)"]
        description: "Primary key"

      org_unit_id:
        type: uuid
        attributes: ["@required", "@exclude_from_foreign_key_check"]
        description: "Owning org-unit node (organization.org_units)"

      user_id:
        type: uuid
        attributes: ["@required", "@foreign_key(User.id)"]
        description: "User ID"

      role_id:
        type: uuid?
        attributes: ["@foreign_key(Role.id)"]
        description: "Role ID in organization"

      status:
        type: OrganizationMembershipStatus
        attributes: ["@default(active)"]
        description: "Membership status"

      joined_at:
        type: datetime
        attributes: ["@required", "@default(now)"]
        description: "When user joined organization"

      left_at:
        type: datetime?
        description: "When user left organization"

      metadata:
        type: Metadata
        attributes: ["@audit_metadata"]
        description: "Audit metadata (created_at, updated_at, deleted_at, created_by, updated_by, deleted_by)"

    relations:
      user:
        type: User
        attributes: ["@one", "@foreign_key(user_id)", "@on_delete(cascade)"]

      role:
        type: Role?
        attributes: ["@one", "@foreign_key(role_id)", "@on_delete(set_null)"]

    indexes:
      - type: index
        fields: [org_unit_id]
      - type: index
        fields: [user_id]
      - type: index
        fields: [org_unit_id, user_id]
      - type: index
        fields: [status]

enums:
  - name: OrganizationMembershipStatus
    variants:
      - name: active
        default: true
        description: "Active membership"
      - name: inactive
        description: "Inactive membership"
      - name: pending
        description: "Pending membership"
      - name: suspended
        description: "Suspended membership"
