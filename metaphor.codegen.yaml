# Codegen policy for sapiens.
#
# `user_owned` globs are files the schema generator must NEVER read, merge, or
# delete — `metaphor schema generate [--force]` skips them wholesale.
#
# This module was scaffolded by an earlier generator generation and has since
# grown hand-written subsystems throughout src/ (auth middleware, domain
# services, value objects, CLI, seeders). The current generator would neither
# reproduce nor correctly preserve that layout, so the ENTIRE source tree is
# declared user-owned: a `--force` run becomes a no-op instead of a massacre.
#
# Pruning this list back to per-file entries requires a deliberate
# modernization pass that reconciles the tree with the current generator's
# layout — do not shrink it as part of routine schema edits.

user_owned:
  # Whole hand-grown source tree (see rationale above).
  - "src/**"

  # Hand-written outbox/inbox tables (not schema-derived — the transactional
  # outbox this module's UserCreated staging writes into).
  - "migrations/*sapiens_outbox*"

  # Hand-written org-membership re-key (rename organization_id -> org_unit_id on
  # the five membership-axis tables; the create files stay as history so fresh
  # databases replay create-then-rename and converge).
  - "migrations/*rekey_organization_id*"

  # Hand-written auth-context lookup (SECURITY DEFINER function exempting the
  # pre-scope session verbs — login / me / refresh — from the org fence; not
  # schema-derived).
  - "migrations/*auth_lookup*"

  # Hand-written auth hardening tables (not schema-derived — the signup
  # kill-switch policy, the durable public-form throttle buckets, and the
  # scoped expiring trusted-device keys).
  - "migrations/*auth_public_form_hardening*"

  # Hand-written tenancy strip on integration_credentials (ADR-0029): drops the
  # company-leading indexes, the company RLS policy, and the company_id column;
  # the module is tenant-agnostic and the composing service's decorator owns org
  # scoping. The generator-emitted create files stay as history so fresh
  # databases replay create-then-strip and converge.
  - "migrations/*strip_tenancy*"

  # Hand-written tests and module documentation.
  - "tests/**"
  - "docs/**"
